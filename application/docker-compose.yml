services:
  db:
    image: postgres:17          
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-findings}
      POSTGRES_USER: ${POSTGRES_USER:-findings_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:5432:5432"
  
  test-db:
    image: postgres:17 
    environment:
      POSTGRES_DB: findings_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:5433:5432"
    profiles: ["test"]

  migrate:
    image: findings-platform:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-findings_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-findings}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    image: findings-platform:local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-findings_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-findings}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}    
    ports:
      - "127.0.0.1:8000:8000"         
    depends_on:  
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
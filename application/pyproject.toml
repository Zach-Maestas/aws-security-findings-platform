[project]
name = "findings_platform"
version = "0.1.0"
description = "Backend API for managing cloud security findings and incidents"
readme = "README.md"
authors = [
    { name = "Zach-Maestas", email = "zachary.maestas03@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "sqlalchemy>=2.0.53",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

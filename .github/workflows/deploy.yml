name: Deploy Infrastructure

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'infrastructure/terraform/**'
  #     - 'application/**'
  #     - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "124355647999"
  PROJECT: secops-pipeline

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # =====================================================================
      # Authenticate to AWS via OIDC (no stored credentials)
      # =====================================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      # =====================================================================
      # Terraform Apply (creates ECR repos + all infrastructure)
      # =====================================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: infrastructure/terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color
        working-directory: infrastructure/terraform

      # =====================================================================
      # Build, push, init DB, and scale up ECS (reuse existing scripts)
      # =====================================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set script permissions
        run: chmod +x infrastructure/scripts/deploy/*.sh

      - name: Build and push images
        run: ./infrastructure/scripts/deploy/01_build_and_push_images.sh

      - name: Run DB init
        run: ./infrastructure/scripts/deploy/02_run_db_init.sh

      - name: Scale up ECS service
        run: ./infrastructure/scripts/deploy/03_scale_ecs_service.sh 1

name: Deploy Infrastructure

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'infrastructure/terraform/**'
  #     - 'application/**'
  #     - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT: ${{ vars.PROJECT }}

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # TEMPORARY: prints the actual OIDC token claims for debugging the
      # sts:AssumeRoleWithWebIdentity denial. Remove once resolved.
      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .

      # =====================================================================
      # Authenticate to AWS via OIDC (no stored credentials)
      # =====================================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      # =====================================================================
      # Terraform Apply (network foundation only, for now)
      # =====================================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init
        working-directory: infrastructure/terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color
        working-directory: infrastructure/terraform

      # =====================================================================
      # Build/push, DB init, and ECS scale-up steps come back once the
      # application and data layers are rebuilt.
      # =====================================================================

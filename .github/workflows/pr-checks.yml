name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT: ${{ vars.PROJECT }}

jobs:
  # ===========================================================================
  # Application unit and integration tests
  # ===========================================================================
  app-tests:
    name: Application Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: findings_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/findings_test
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/findings_test
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest

  # ===========================================================================
  # Application Lint: Ruff lint and format checks
  # ===========================================================================
  app-lint:
    name: Application Lint (Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      - name: Ruff lint check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  # ===========================================================================
  # Terraform Format and Validate
  # ===========================================================================
  terraform-lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4

      - name: Terraform Format
        run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: infrastructure/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: infrastructure/terraform

  # ===========================================================================
  # Secret Detection: scan git history for leaked credentials
  # ===========================================================================
  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # IaC Security: scan Terraform for misconfigurations
  # ===========================================================================
  checkov:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          # === Checks ===
          # 1: "Ensure IAM policies that allow full “-” administrative privileges are not created"
          # 2: "Ensure ALB protocol is HTTPS"
          # 16: "Ensure all data stored in the RDS is securely encrypted at rest"
          # 20: "S3 Bucket has an ACL defined which allows public READ access"
          # 23: "Ensure every security group rule has a description"
          # 24: "Ensure no security groups allow ingress from 0.0.0.0:0 to port 22"
          # 60: "Ensure IAM role allows only specific services or principals to assume it"
          # 163: "Ensure ECR image scanning on push is enabled"
          check: CKV_AWS_1,CKV_AWS_2,CKV_AWS_16,CKV_AWS_20,CKV_AWS_23,CKV_AWS_24,CKV_AWS_60,CKV_AWS_163
          quiet: true
          output_format: github_failed_only

  # ===========================================================================
  # Container Security: build and scan Docker images for CVEs
  # ===========================================================================

  trivy:
    name: Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build application image
        run: docker build -t findings-platform:ci ./application

      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: findings-platform:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ===========================================================================
  # Terraform Plan: show what will change in AWS
  # ===========================================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [terraform-lint, gitleaks, checkov]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-github-actions-plan
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init
        working-directory: infrastructure/terraform

      - name: Terraform Plan
        run: terraform plan -no-color -input=false
        working-directory: infrastructure/terraform

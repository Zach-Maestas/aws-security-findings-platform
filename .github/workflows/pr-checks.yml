name: PR Security Checks

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT: ${{ vars.PROJECT }}

jobs:
  # ===========================================================================
  # Terraform Format and Validate
  # ===========================================================================
  terraform-lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4

      - name: Terraform Format
        run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: infrastructure/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: infrastructure/terraform

  # ===========================================================================
  # Secret Detection: scan git history for leaked credentials
  # ===========================================================================
  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # IaC Security: scan Terraform for misconfigurations
  # ===========================================================================
  checkov:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          # === Checks ===
          # 1: "Ensure IAM policies that allow full “-” administrative privileges are not created"
          # 2: "Ensure ALB protocol is HTTPS"
          # 16: "Ensure all data stored in the RDS is securely encrypted at rest"
          # 20: "S3 Bucket has an ACL defined which allows public READ access"
          # 23: "Ensure every security group rule has a description"
          # 24: "Ensure no security groups allow ingress from 0.0.0.0:0 to port 22"
          # 60: "Ensure IAM role allows only specific services or principals to assume it"
          # 163: "Ensure ECR image scanning on push is enabled"
          check: CKV_AWS_1,CKV_AWS_2,CKV_AWS_16,CKV_AWS_20,CKV_AWS_23,CKV_AWS_24,CKV_AWS_60,CKV_AWS_163
          quiet: true
          output_format: github_failed_only

  # ===========================================================================
  # Container Security: build and scan Docker images for CVEs
  # ---------------------------------------------------------------------------
  # Intentionally removed for now — application/backend and the db-init image
  # were torn out along with the app/data layers during the backend rescope,
  # so there's nothing to build or scan. Re-add a `trivy` job here (build
  # each service image, then aquasecurity/trivy-action per image) once the
  # new backend has a Dockerfile again. See git history on this file for the
  # original job definition to crib from.
  # ===========================================================================

  # ===========================================================================
  # Terraform Plan: show what will change in AWS
  # ===========================================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [terraform-lint, gitleaks, checkov]
    steps:
      - uses: actions/checkout@v5

      # TEMPORARY: prints the actual OIDC token claims for debugging the
      # sts:AssumeRoleWithWebIdentity denial. Remove once resolved.
      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-github-actions-plan
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init
        working-directory: infrastructure/terraform

      - name: Terraform Plan
        run: terraform plan -no-color -input=false
        working-directory: infrastructure/terraform
